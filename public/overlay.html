<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay Ruleta OBS - TikWheel Pro</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    canvas {
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
    }
    #hud {
      position: absolute;
      top: 30px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 16px;
      color: white;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="hud">
      <div id="hud-user" style="font-weight: 900; font-size: 16px; color: #ec4899; margin-bottom: 2px;"></div>
      <div id="hud-gift" style="font-size: 13px; color: #94a3b8;"></div>
    </div>
    <canvas id="rouletteCanvas" width="500" height="500"></canvas>
  </div>

  <script>
    // Obtener token dinámico de la URL (/overlay/TOKEN)
    const pathSegments = window.location.pathname.split('/');
    const token = pathSegments[pathSegments.length - 1];

    const socket = io({
      query: { token, role: 'overlay' }
    });

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');

    // --- WEB AUDIO API (Sintetizador de Sonidos) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTickSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playWinSound() {
      try {
        initAudio();
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Acorde C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + index * 0.08);
          osc.stop(audioCtx.currentTime + index * 0.08 + 0.4);
        });
      } catch (e) {}
    }

    // --- CONFIGURACIÓN DE SECTORES ---
    let globalConfig = {
      1: [
        { label: "Saludo VIP", color: "#10b981", weight: 35 },
        { label: "Elegir Canción", color: "#0ea5e9", weight: 25 },
        { label: "+10 Segundos", color: "#10b981", weight: 20 },
        { label: "Nada / Sigue", color: "#334155", weight: 15 },
        { label: "Pase Nivel 2", color: "#f59e0b", weight: 5 }
      ],
      2: [
        { label: "Reto Extremo", color: "#8b5cf6", weight: 40 },
        { label: "Silenciar 1 Min", color: "#ec4899", weight: 30 },
        { label: "Castigo", color: "#1e293b", weight: 30 }
      ],
      3: [
        { label: "Giro Legendario", color: "#f43f5e", weight: 50 },
        { label: "Premio Supremo", color: "#eab308", weight: 50 }
      ]
    };

    let activeSectors = globalConfig[1];
    let currentAngle = 0;
    let isSpinning = false;
    let queue = [];
    let ledOffset = 0;

    // Sincronizar con el servidor y el dashboard en tiempo real
    socket.on('overlay:sync_config', (newConfig) => {
      if (newConfig) {
        globalConfig = newConfig;
        activeSectors = globalConfig[1] || globalConfig[Object.keys(globalConfig)[0]] || [];
        drawWheel();
      }
    });

    function drawWheel() {
      const numSectors = activeSectors.length;
      if (numSectors === 0) return;
      const arc = (2 * Math.PI) / numSectors;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(250, 250);
      ctx.rotate(currentAngle);

      activeSectors.forEach((sector, i) => {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = sector.color || '#333333';
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 195, angle, angle + arc);
        ctx.lineTo(0, 0);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff33';
        ctx.stroke();

        // Texto del sector
        ctx.save();
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px system-ui, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(sector.label, 155, 5);
        ctx.restore();
      });

      ctx.restore();

      // Aro exterior y Anillo de Luces LED intermitentes
      ctx.beginPath();
      ctx.arc(250, 250, 195, 0, 2 * Math.PI);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      const numLEDs = 28;
      for (let i = 0; i < numLEDs; i++) {
        const ledAngle = (i / numLEDs) * 2 * Math.PI;
        const x = 250 + Math.cos(ledAngle) * 206;
        const y = 250 + Math.sin(ledAngle) * 206;
        ctx.beginPath();
        ctx.arc(x, y, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = ((i + Math.floor(ledOffset)) % 2 === 0) ? '#38bdf8' : '#f43f5e';
        ctx.fill();
      }

      // Puntero superior fijo
      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.moveTo(250, 12);
      ctx.lineTo(238, 40);
      ctx.lineTo(262, 40);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    function determineLevelByCoins(coins) {
      if (coins >= 100) return 3; // Nivel Difícil
      if (coins >= 20) return 2;  // Nivel Medio
      return 1;                   // Nivel Fácil
    }

    function spinWheel(targetIndex, callback) {
      if (isSpinning) return;
      isSpinning = true;

      const numSectors = activeSectors.length;
      const arc = (2 * Math.PI) / numSectors;
      const targetAngle = 14 * 2 * Math.PI + (numSectors - targetIndex) * arc - arc / 2;

      let start = null;
      const duration = 4000;
      let lastSectorPassed = -1;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / duration;
        
        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 3);
          currentAngle = targetAngle * easeOut;
          
          // Animar luces LED y sonido de tick al pasar sectores
          ledOffset = (progress * 40) % numLEDs_safe();
          const normalizedAngle = (currentAngle + arc / 2) % (2 * Math.PI);
          const currentSector = Math.floor(normalizedAngle / arc);
          if (currentSector !== lastSectorPassed) {
            playTickSound();
            lastSectorPassed = currentSector;
          }

          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = targetAngle % (2 * Math.PI);
          isSpinning = false;
          drawWheel();
          playWinSound(); // Sonido triunfal al frenar
          if (callback) callback();
        }
      }

      requestAnimationFrame(animate);
    }

    function numLEDs_safe() { return 28; }

    // Escuchar regalos entrantes (ya sea reales o desde el simulador del dashboard)
    socket.on('tiktok:gift', (gift) => {
      queue.push(gift);
      processQueue();
    });

    function processQueue() {
      if (isSpinning || queue.length === 0) return;
      const gift = queue.shift();

      // Definir nivel según monedas
      const level = determineLevelByCoins(gift.coins || 1);
      activeSectors = globalConfig[level] && globalConfig[level].length > 0 ? globalConfig[level] : globalConfig[1];
      drawWheel();

      // Mostrar HUD superior con los datos del usuario
      const hud = document.getElementById('hud');
      document.getElementById('hud-user').innerText = `${gift.user} giró la ruleta (Nivel ${level})`;
      document.getElementById('hud-gift').innerText = `Regalo: ${gift.giftName} (${gift.coins} monedas)`;
      hud.style.display = 'block';

      // Selección ponderada basada en los 'weights' (pesos) del nivel
      const totalWeight = activeSectors.reduce((sum, s) => sum + (Number(s.weight) || 1), 0);
      let randomWeight = Math.random() * totalWeight;
      let targetIndex = 0;

      for (let i = 0; i < activeSectors.length; i++) {
        randomWeight -= (Number(activeSectors[i].weight) || 1);
        if (randomWeight <= 0) {
          targetIndex = i;
          break;
        }
      }

      const wonPrize = activeSectors[targetIndex].label;

      spinWheel(targetIndex, () => {
        // Notificar al servidor el resultado para el historial del dashboard
        socket.emit('overlay:spin_result', { gift, prize: wonPrize });

        setTimeout(() => {
          hud.style.display = 'none';
          processQueue();
        }, 3000);
      });
    }

    // Dibujo inicial al cargar el overlay
    drawWheel();
  </script>
</body>
</html>
