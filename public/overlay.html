<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay Ruleta OBS</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    canvas {
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
    }
    #hud {
      position: absolute;
      top: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      text-align: center;
      backdrop-filter: blur(5px);
      display: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="hud">
      <div id="hud-user" style="font-weight: bold; font-size: 14px; color: #ec4899;"></div>
      <div id="hud-gift" style="font-size: 12px; color: #94a3b8;"></div>
    </div>
    <canvas id="rouletteCanvas" width="500" height="500"></canvas>
  </div>

  <script>
    const pathSegments = window.location.pathname.split('/');
    const token = pathSegments[pathSegments.length - 1];

    const socket = io({
      query: { token, role: 'overlay' }
    });

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');

    // Configuración por defecto por si el servidor aún no tiene datos
    let globalConfig = {
      1: [
        { label: "Premio A", color: "#FF3366", weight: 1 },
        { label: "Premio B", color: "#33CCFF", weight: 1 },
        { label: "Premio C", color: "#FFCC00", weight: 1 },
        { label: "Premio D", color: "#33FF66", weight: 1 }
      ],
      2: [
        { label: "Reto 1", color: "#9933FF", weight: 1 },
        { label: "Reto 2", color: "#FF6633", weight: 1 },
        { label: "Castigo", color: "#333333", weight: 2 },
        { label: "Premio Doble", color: "#00FFCC", weight: 1 }
      ],
      3: [
        { label: "VIP Épico", color: "#FFD700", weight: 1 },
        { label: "Giro Legendario", color: "#FF0055", weight: 1 },
        { label: "Premio Supremo", color: "#00FFFF", weight: 1 }
      ]
    };

    let activeSectors = globalConfig[1];
    let currentAngle = 0;
    let isSpinning = false;
    let queue = [];

    // Recibir sincronización inicial o cambios en tiempo real desde el dashboard
    socket.on('overlay:sync_config', (newConfig) => {
      if (newConfig) {
        globalConfig = newConfig;
        activeSectors = globalConfig[1] || globalConfig[Object.keys(globalConfig)[0]];
        drawWheel();
      }
    });

    function drawWheel() {
      const numSectors = activeSectors.length;
      if (numSectors === 0) return;
      const arc = (2 * Math.PI) / numSectors;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(250, 250);
      ctx.rotate(currentAngle);

      activeSectors.forEach((sector, i) => {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = sector.color || '#333333';
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 210, angle, angle + arc);
        ctx.lineTo(0, 0);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff22';
        ctx.stroke();

        // Texto del sector
        ctx.save();
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(sector.label, 170, 6);
        ctx.restore();
      });

      ctx.restore();

      // Aro exterior decorativo
      ctx.beginPath();
      ctx.arc(250, 250, 210, 0, 2 * Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // Puntero superior
      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.moveTo(250, 15);
      ctx.lineTo(238, 42);
      ctx.lineTo(262, 42);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    function determineLevelByCoins(coins) {
      if (coins >= 100) return 3; // Nivel Difícil (Regalos caros)
      if (coins >= 20) return 2;  // Nivel Medio
      return 1;                   // Nivel Fácil
    }

    function spinWheel(targetIndex, callback) {
      if (isSpinning) return;
      isSpinning = true;

      const numSectors = activeSectors.length;
      const arc = (2 * Math.PI) / numSectors;
      const targetAngle = 12 * 2 * Math.PI + (numSectors - targetIndex) * arc - arc / 2;

      let start = null;
      const duration = 4000;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / duration;
        
        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 3);
          currentAngle = targetAngle * easeOut;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = targetAngle % (2 * Math.PI);
          isSpinning = false;
          drawWheel();
          if (callback) callback();
        }
      }

      requestAnimationFrame(animate);
    }

    // Escuchar regalos en tiempo real
    socket.on('tiktok:gift', (gift) => {
      queue.push(gift);
      processQueue();
    });

    function processQueue() {
      if (isSpinning || queue.length === 0) return;
      const gift = queue.shift();

      // Determinar nivel según monedas del regalo
      const level = determineLevelByCoins(gift.coins || 1);
      activeSectors = globalConfig[level] && globalConfig[level].length > 0 ? globalConfig[level] : globalConfig[1];
      drawWheel();

      // Mostrar HUD con datos del espectador
      const hud = document.getElementById('hud');
      document.getElementById('hud-user').innerText = `${gift.user} giró la ruleta (Nivel ${level})`;
      document.getElementById('hud-gift').innerText = `Regalo: ${gift.giftName} (${gift.coins} monedas)`;
      hud.style.display = 'block';

      // Selección ponderada basada en los 'weights' configurados
      const totalWeight = activeSectors.reduce((sum, s) => sum + (Number(s.weight) || 1), 0);
      let randomWeight = Math.random() * totalWeight;
      let targetIndex = 0;

      for (let i = 0; i < activeSectors.length; i++) {
        randomWeight -= (Number(activeSectors[i].weight) || 1);
        if (randomWeight <= 0) {
          targetIndex = i;
          break;
        }
      }

      spinWheel(targetIndex, () => {
        setTimeout(() => {
          hud.style.display = 'none';
          processQueue();
        }, 2500);
      });
    }

    // Dibujo inicial al cargar
    drawWheel();
  </script>
</body>
</html>
